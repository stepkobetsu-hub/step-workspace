<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STEP業務ホーム 配置復旧</title>
  <link rel="icon" href="favicon.svg">
  <style>
    :root{font-family:system-ui,"Yu Gothic",sans-serif;color:#102a4c;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(620px,100%);padding:32px;border:1px solid #dfe7f1;border-radius:16px;background:#fff;box-shadow:0 18px 55px rgba(15,39,71,.12)}
    h1{margin:0 0 10px;font-size:26px}p{color:#5c6d82;line-height:1.7}.preview{margin:22px 0;padding:18px;border-radius:12px;background:#f4f7fb}
    .preview strong{display:block;margin-bottom:8px}.preview ul{margin:0;padding-left:22px;line-height:1.8}
    button{width:100%;min-height:52px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{cursor:wait;opacity:.55}.status{min-height:28px;margin:16px 0 0;font-weight:700}.status.ok{color:#177245}.status.error{color:#b4233a}
    small{display:block;margin-top:18px;color:#738196;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <h1>STEP業務ホーム 配置復旧</h1>
    <p>このChromeに残っている項目・カード配置を確認し、全パソコン用の設定として保存します。元のSTEP業務ホームは更新しないでください。</p>
    <section class="preview" id="preview"><strong>保存データを確認しています…</strong></section>
    <button id="restoreButton" type="button" disabled>この配置を全端末へ復旧する</button>
    <p class="status" id="status" aria-live="polite"></p>
    <small>送信対象は項目・カード配置とお気に入りだけです。ID・パスワードは送信しません。</small>
  </main>
  <script>
  (()=>{
    'use strict';
    const GAS='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
    const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch(_){return fallback}};
    const config=read('stepWorkspaceConfigV1',null);
    const favorites=read('stepWorkspaceFavoritesV1',[]);
    const auth=read('stepStaffAppAuth',null);
    const preview=document.getElementById('preview');
    const button=document.getElementById('restoreButton');
    const status=document.getElementById('status');
    const categories=Array.isArray(config?.categories)?config.categories:[];
    const customApps=Array.isArray(config?.customApps)?config.customApps:[];
    if(!config){preview.innerHTML='<strong>復旧できる配置データが見つかりません。</strong>';status.textContent='このページを、最新版が残っているChromeで開いてください。';status.className='status error';return}
    const categoryNames=categories.map(item=>String(item?.name||'').trim()).filter(Boolean);
    const customNames=customApps.map(item=>String(item?.displayName||'').trim()).filter(Boolean);
    preview.replaceChildren();
    const title=document.createElement('strong');title.textContent=`項目 ${categoryNames.length}件・追加カード ${customNames.length}件`;
    const list=document.createElement('ul');
    for(const name of categoryNames){const item=document.createElement('li');item.textContent=name;list.append(item)}
    if(customNames.length){const item=document.createElement('li');item.textContent=`追加カード：${customNames.join('、')}`;list.append(item)}
    preview.append(title,list);
    if(!auth?.systemPortalSessionToken){status.textContent='このChromeのログイン情報が見つかりません。元のページでログインしたまま開いてください。';status.className='status error';return}
    button.disabled=false;
    button.addEventListener('click',async()=>{
      button.disabled=true;status.textContent='全パソコンへ復旧中…';status.className='status';
      try{
        const latestResponse=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getWorkspaceConfig',systemPortalSessionToken:auth.systemPortalSessionToken}),redirect:'follow'});const latest=JSON.parse(await latestResponse.text());if(!latestResponse.ok||!latest.success)throw new Error(latest.error||'共有設定の最新版を確認できませんでした。');
        const response=await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveWorkspaceConfig',systemPortalSessionToken:auth.systemPortalSessionToken,expectedVersion:Number(latest.version||0),sharedState:{schemaVersion:1,workspaceConfig:config,favorites:Array.isArray(favorites)?favorites:[]}}),redirect:'follow'});
        const result=JSON.parse(await response.text());
        if(!response.ok||!result.success)throw new Error(result.error||'保存できませんでした。');
        status.textContent=`全パソコンへ復旧しました（版 ${result.version}）`;status.className='status ok';button.textContent='復旧完了';
      }catch(error){status.textContent=error.message||'保存できませんでした。';status.className='status error';button.disabled=false}
    });
  })();
  </script>
</body>
</html>
