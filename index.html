<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#142033">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>STEP 業務ホーム</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260813-6">
</head>
<body data-state="checking">
  <section class="state-screen loading-screen" id="loadingScreen" aria-live="polite">
    <div class="loading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p>認証状態を確認しています</p>
  </section>

  <main class="login-screen" id="loginScreen" hidden>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand" aria-hidden="true">S</div>
      <p class="eyebrow">STEP WORKSPACE</p>
      <h1 id="loginTitle">STEP 業務ホーム</h1>
      <p class="login-lead">日常業務で使うアプリへ、ここからすぐに移動できます。</p>
      <form id="loginForm">
        <label for="loginCode">ID</label>
        <input id="loginCode" name="code" type="text" inputmode="text" autocomplete="username" required>
        <label for="loginPassword">パスワード</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password">
        <button class="primary-button" id="loginButton" type="submit">ログイン</button>
        <p class="form-error" id="loginError" role="alert" hidden></p>
      </form>
      <p class="login-note">この端末では、明示的にログアウトするまでログイン状態を維持します。</p>
    </section>
  </main>

  <div class="app-shell" id="appShell" hidden>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="STEP 業務ホーム">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span><strong>STEP 業務ホーム</strong><small>STEP WORKSPACE</small></span>
        </a>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z"/></svg>
          <label class="sr-only" for="searchInput">アプリを検索</label>
          <input id="searchInput" type="search" placeholder="アプリを検索" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <nav class="header-actions" aria-label="ユーティリティ">
          <a href="https://stepkobetsu-hub.github.io/step-system-registry/">資産管理</a>
          <button id="logoutButton" type="button">ログアウト</button>
        </nav>
      </div>
    </header>

    <main class="content" id="mainContent">
      <div class="welcome-row">
        <div><p class="eyebrow">WORKSPACE</p><h1>おはようございます<span id="userName"></span></h1><p>今日使うアプリを選んでください。</p></div>
        <p class="app-count" id="appCount"></p>
      </div>

      <section id="searchSection" hidden>
        <div class="section-heading"><div><p class="section-kicker">SEARCH</p><h2>検索結果</h2></div><p id="searchCount"></p></div>
        <div class="app-grid" id="searchGrid"></div>
        <div class="empty-state" id="searchEmpty" hidden><strong>該当するアプリがありません</strong><p>別のキーワードで検索してください。</p></div>
      </section>

      <div id="defaultSections">
        <section id="favoriteSection">
          <div class="section-heading"><div><p class="section-kicker">FAVORITES</p><h2>よく使うアプリ</h2></div><p>☆で追加・解除できます</p></div>
          <div class="app-grid featured-grid" id="favoriteGrid"></div>
        </section>

        <section id="recentSection" hidden>
          <div class="section-heading"><div><p class="section-kicker">RECENT</p><h2>最近使ったアプリ</h2></div></div>
          <div class="app-grid compact-grid" id="recentGrid"></div>
        </section>

        <section class="all-apps-section">
          <div class="section-heading"><div><p class="section-kicker">ALL APPS</p><h2>用途から探す</h2></div></div>
          <nav class="category-tabs" id="categoryTabs" aria-label="アプリ分類"></nav>
          <div id="categorySections"></div>
        </section>
      </div>
    </main>
  </div>

  <template id="appCardTemplate">
    <article class="app-card">
      <button class="favorite-button" type="button" aria-label="お気に入りに追加"><span aria-hidden="true">☆</span></button>
      <a class="app-link">
        <span class="app-icon" aria-hidden="true"></span>
        <span class="app-copy"><strong></strong><small></small></span>
        <span class="open-label">開く <span aria-hidden="true">→</span></span>
      </a>
    </article>
  </template>

  <script src="core.js?v=20260813-6"></script>
  <script src="app.js?v=20260813-6"></script>
</body>
</html>
