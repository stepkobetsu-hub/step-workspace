name: Update learning progress workspace link 20260822

on:
  pull_request:
    branches: [main]
    paths:
      - '.learning-progress-workspace-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update learning progress link
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const url='https://step-progress-api.stepkobetsu.workers.dev/';
          const version='20260822-progress-v3-1';
          const files=['app.js','app.v20260818-32.js'];
          for(const file of files){
            let s=fs.readFileSync(file,'utf8');
            s=s.replace(/const REGISTRY_EXPORT='https:\/\/stepkobetsu-hub\.github\.io\/step-system-registry\/workspace-apps\.json\?v=[^']+';/,`const REGISTRY_EXPORT='https://stepkobetsu-hub.github.io/step-system-registry/workspace-apps.json?v=${version}';`);
            s=s.replace(/const APP_CATALOG='app-catalog\.json\?v=[^']+';/,`const APP_CATALOG='app-catalog.json?v=${version}';`);
            s=s.replace("const REGISTRY_CACHE_KEY='stepWorkspaceRegistryCacheV1';","const REGISTRY_CACHE_KEY='stepWorkspaceRegistryCacheV2';");
            const showNeedle="  function showRegistrySource(source){\n    if(!Array.isArray(source)||!source.length)return false;";
            const showReplacement=`  function showRegistrySource(source){\n    if(!Array.isArray(source)||!source.length)return false;\n    source=source.map(item=>{const name=String(item?.displayName||item?.['正式名称']||item?.['システム名']||'');const id=String(item?.ID||item?.id||'');if(id==='learning-progress'||name.includes('ステップ＆ゴール進捗管理')||name.includes('学習進捗管理'))return Object.assign({},item,{ID:item.ID||'learning-progress',id:item.id||'learning-progress',displayName:'ステップ＆ゴール進捗管理','正式名称':'ステップ＆ゴール進捗管理','システム名':'ステップ＆ゴール進捗管理',productionUrl:'${url}','利用者向けURL':'${url}','状態':'V3本番稼働中（D1直保存・旧進捗復元済み）'});return item});`;
            if(s.includes(showNeedle))s=s.replace(showNeedle,showReplacement);else if(!s.includes("id==='learning-progress'||name.includes('ステップ＆ゴール進捗管理')"))throw new Error(file+': showRegistrySource patch point not found');
            const ensureNeedle="    const value=Core.normalizeWorkspaceConfig(config);";
            const ensureReplacement=`    const value=Core.normalizeWorkspaceConfig(config);\n    value.customApps=value.customApps.map(app=>app.id==='learning-progress'?Object.assign({},app,{displayName:'ステップ＆ゴール進捗管理',productionUrl:'${url}'}):app);\n    if(value.cardOverrides?.['learning-progress']?.url)delete value.cardOverrides['learning-progress'].url;`;
            if(s.includes(ensureNeedle)&&!s.includes("value.customApps=value.customApps.map(app=>app.id==='learning-progress'"))s=s.replace(ensureNeedle,ensureReplacement);
            fs.writeFileSync(file,s);
          }

          const catalog=JSON.parse(fs.readFileSync('app-catalog.json','utf8'));
          const record={id:'learning-progress',displayName:'ステップ＆ゴール進捗管理',description:'ステップ＆ゴール教材の学習進捗・目標範囲・宿題チェック',category:'student',productionUrl:url,parentSystem:'ステップ＆ゴール進捗管理',keywords:['ステップ','ゴール','学習進捗','目標範囲','宿題','D1'],favorite:true,recent:true,status:'active'};
          const ci=catalog.apps.findIndex(app=>app.id==='learning-progress'||app.displayName==='ステップ＆ゴール進捗管理'||app.displayName==='学習進捗管理');
          if(ci>=0)catalog.apps[ci]=Object.assign({},catalog.apps[ci],record);else catalog.apps.push(record);
          catalog.updatedAt='2026-08-22';
          fs.writeFileSync('app-catalog.json',JSON.stringify(catalog,null,2)+'\n');

          let html=fs.readFileSync('index.html','utf8');
          html=html.replace(/app-catalog\.json\?v=[^\"']+/g,`app-catalog.json?v=${version}`);
          html=html.replace(/app\.v20260818-32\.js\?v=[^\"']+/g,`app.v20260818-32.js?v=${version}`);
          fs.writeFileSync('index.html',html);
          NODE
      - name: Verify
        run: |
          grep -q "step-progress-api.stepkobetsu.workers.dev" app.v20260818-32.js
          grep -q "stepWorkspaceRegistryCacheV2" app.v20260818-32.js
          grep -q '"id": "learning-progress"' app-catalog.json
          grep -q 'app.v20260818-32.js?v=20260822-progress-v3-1' index.html
      - name: Commit
        run: |
          git config user.name 'stepkobetsu-hub'
          git config user.email 'stepkobetsu@gmail.com'
          git add app.js app.v20260818-32.js app-catalog.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Point learning progress cards to current V3 production'
          git push origin HEAD:main
