name: Preserve registry shared config
on:
  push:
    paths:
      - .github/preserve-registry-shared-config-20260903.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve registry config in workspace shared state
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('app.v20260818-32.js'),Path('app.js')]
          for p in paths:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old='sharedSaveTimer:null,sharedSavePromise:Promise.resolve()};'
              new='sharedSaveTimer:null,sharedSavePromise:Promise.resolve(),sharedEnvelope:{}};'
              if old in s:
                  s=s.replace(old,new,1)
              old2='function sharedPayload(){return {schemaVersion:1,workspaceConfig:clone(state.config),favorites:[...state.favorites]}}'
              new2="function sharedPayload(){return Object.assign({},clone(state.sharedEnvelope||{}),{schemaVersion:1,workspaceConfig:clone(state.config),favorites:[...state.favorites]})}"
              if old2 in s:
                  s=s.replace(old2,new2,1)
              old3='state.sharedApplying=true;state.config=Core.normalizeWorkspaceConfig(payload.workspaceConfig);'
              new3='state.sharedApplying=true;state.sharedEnvelope=clone(payload||{});state.config=Core.normalizeWorkspaceConfig(payload.workspaceConfig);'
              if old3 in s:
                  s=s.replace(old3,new3,1)
              if 'sharedEnvelope' not in s:
                  raise SystemExit(f'failed to patch {p}')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/preserve-registry-shared-config-20260903.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add app.v20260818-32.js app.js .github/preserve-registry-shared-config-20260903.trigger
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve registry config while saving workspace layout'
            git push
          fi
